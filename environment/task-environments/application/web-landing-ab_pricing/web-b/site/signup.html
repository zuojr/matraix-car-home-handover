<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NimbusDesk — Start your free trial</title>
  <style>
    body { margin:0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
           color:#12121a; background:#faf9ff; }
    .wrap { max-width: 460px; margin: 0 auto; padding: 56px 20px; text-align:center; }
    h1 { font-size:26px; margin:0 0 8px; }
    p { color:#63636e; }
    .card { border:1px solid #e6e6ea; border-radius:14px; padding:24px; margin-top:24px; text-align:left; background:#fff; }
    label { display:block; font-size:13px; color:#63636e; margin:12px 0 4px; }
    input { width:100%; padding:10px; border:1px solid #e6e6ea; border-radius:8px; font-size:15px; }
    .go { display:block; width:100%; margin-top:18px; background:#7c3aed; color:#fff; border:none;
          padding:12px; border-radius:9px; font-weight:700; font-size:16px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Start your 14-day free trial</h1>
    <p>Join 50,000+ teams doing their best work on NimbusDesk.</p>
    <div class="card">
      <label for="email">Work email</label>
      <input id="email" type="email" placeholder="you@company.com" />
      <label for="pw">Password</label>
      <input id="pw" type="password" placeholder="Choose a password" />
      <button class="go" type="button">Start free trial</button>
    </div>
  </div>
</body>
</html>
