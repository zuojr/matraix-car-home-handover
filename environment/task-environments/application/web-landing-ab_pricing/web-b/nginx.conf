server {
    listen 80;
    server_name _;

    # Real on-disk log file (the base image symlinks the default access log to
    # stdout). This file is collected as a trial artifact so the objective
    # signup click can be recovered from server-side evidence.
    access_log /var/log/site/web-b.access.log;

    root /usr/share/nginx/html;
    index index.html;

    # The signup CTA points here. Recording this request is the objective
    # conversion signal; the confirmation page is what the persona sees.
    location = /signup {
        try_files /signup.html =200;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
