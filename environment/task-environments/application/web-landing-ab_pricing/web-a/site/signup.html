<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NimbusDesk — Create your account</title>
  <style>
    body { margin:0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
           color:#1a1a1a; background:#fff; }
    .wrap { max-width: 460px; margin: 0 auto; padding: 56px 20px; text-align:center; }
    h1 { font-size:26px; margin:0 0 8px; }
    p { color:#5c5c5c; }
    .card { border:1px solid #e4e4e7; border-radius:12px; padding:24px; margin-top:24px; text-align:left; }
    label { display:block; font-size:13px; color:#5c5c5c; margin:12px 0 4px; }
    input { width:100%; padding:10px; border:1px solid #e4e4e7; border-radius:8px; font-size:15px; }
    .go { display:block; width:100%; margin-top:18px; background:#2563eb; color:#fff; border:none;
          padding:12px; border-radius:8px; font-weight:600; font-size:16px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Create your free account</h1>
    <p>You're one step away from a tidier workspace.</p>
    <div class="card">
      <label for="email">Work email</label>
      <input id="email" type="email" placeholder="you@company.com" />
      <label for="pw">Password</label>
      <input id="pw" type="password" placeholder="Choose a password" />
      <button class="go" type="button">Create account</button>
    </div>
  </div>
</body>
</html>
