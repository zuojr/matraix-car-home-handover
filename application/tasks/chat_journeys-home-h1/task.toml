version = "1.0"
artifacts = ["/app/output", {source="/records", service="simulator", destination="simulator-records"}, {source="/api-records", service="assistant", destination="sut-api-records"}]
[task]
name = "application/journeys-home-h1"
[metadata]
type = "chatbot"
domain = "home"
difficulty = "hard"
tags = ["journeys", "native-persona", "programmatic", "baseline-sut"]
[verifier]
timeout_sec = 300.0
[agent]
timeout_sec = 1800.0
[environment]
definition = "application/shared-chat-persona"
local_compose = "application/chatbot-api-sidecar_journeys"
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
